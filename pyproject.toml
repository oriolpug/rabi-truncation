[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabi-truncation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "qutip>=5.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebooks = ["ipykernel>=6.0", "nbformat>=5.0", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiment*"]
